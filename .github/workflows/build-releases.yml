name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      # One format failing must not cancel the others; the release job is gated
      # on all of them anyway.
      fail-fast: false
      matrix:
        include:
          - format: debian
            pattern: '*.deb'
          - format: rpm
            pattern: '*.rpm'
          - format: linux-x64
            pattern: '*.tar.gz'

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.format }}
        run: |
          set -euo pipefail
          case "${{ matrix.format }}" in
            debian)
              chmod +x scripts/build-deb.sh
              ./scripts/build-deb.sh
              ;;
            rpm)
              pnpm build
              # --publish never: on a tag electron-builder would otherwise
              # implicitly try to publish to GitHub and demand GH_TOKEN. The
              # release is published by softprops/action-gh-release instead.
              pnpm exec electron-builder --linux rpm --publish never
              mkdir -p dist
              cp release/*.rpm dist/
              ;;
            linux-x64)
              pnpm build
              pnpm exec electron-builder --linux dir --publish never
              VERSION=$(node -p "require('./package.json').version")
              mkdir -p dist/linux-x64
              tar -czf "dist/linux-x64/autopacx-${VERSION}-linux-x64.tar.gz" \
                -C release linux-unpacked
              ;;
          esac
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.format }}-package
          path: dist/**/${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # A tag such as v0.1.0-beta is a prerelease and must NOT be published as
      # the repository's "Latest" stable release, or every beta would be handed
      # to users as the recommended download. Derive the flag from the tag
      # itself so the next release needs no edit here.
      - name: Detect prerelease from tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ (^|[-._])(alpha|beta|b|rc|pre|dev|nightly)[0-9]*$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag '$tag' -> prerelease=$prerelease"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) \
            -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ### Installation

            **Debian / Ubuntu (.deb)**
            ```bash
            sudo dpkg -i autopacx_*_amd64.deb
            ```

            **Fedora / RHEL / CentOS (.rpm)**
            ```bash
            sudo rpm -i autopacx-*.x86_64.rpm
            ```

            **Any Linux x64 (portable tarball)**
            ```bash
            tar -xzf autopacx-*-linux-x64.tar.gz
            ./linux-unpacked/autopacx
            ```
